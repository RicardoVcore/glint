name: Build

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libxcomposite-dev libfreetype-dev \
            libfontconfig1-dev libgl1-mesa-dev ninja-build

      - name: Configure (macOS universal)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Configure
        if: runner.os != 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Verify macOS signatures
        if: runner.os == 'macOS'
        run: |
          for b in build/Glint_artefacts/Release/VST3/Glint.vst3 \
                   build/Glint_artefacts/Release/AU/Glint.component \
                   build/Glint_artefacts/Release/Standalone/Glint.app; do
            codesign --verify --strict --deep --verbose=2 "$b"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: Glint-${{ runner.os }}
          path: |
            build/Glint_artefacts/Release/VST3/Glint.vst3
            build/Glint_artefacts/Release/AU/Glint.component
            build/Glint_artefacts/Release/Standalone/
